<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>Be part of our awesome team and have fun with us</h2>
            <img src="https://img.icons8.com/ios-filled/100/ffffff/rocket--v1.png" alt="rocket" class="rocket">
        </div>
        <div class="right">
            <form id="registerForm">
                <h2>Sign Up</h2>
                <input type="text" name="full_name" placeholder="Full Name" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="email" name="email" placeholder="E-mail" required>
                <label><input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a></label>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
